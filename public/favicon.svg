<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Subtle Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Modern Automotive "A" Emblem with Aerodynamic Wings -->
  <g filter="url(#glow)">
    <!-- Left Wing / Pillar of 'A' -->
    <path d="M16 48 L28 16 L33 16 L23 48 Z" fill="url(#accentGrad)" />
    
    <!-- Right Wing / Pillar of 'A' -->
    <path d="M48 48 L36 16 L31 16 L41 48 Z" fill="url(#accentGrad)" opacity="0.9" />
    
    <!-- Aerodynamic Speed Crossbar -->
    <path d="M19 36 L45 36 L42 32 L22 32 Z" fill="#FFFFFF" />

    <!-- AI Spark Core -->
    <circle cx="32" cy="24" r="3" fill="url(#sparkGrad)" />
  </g>
</svg>
